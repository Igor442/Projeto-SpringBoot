<!DOCTYPE html>
<html lang="pt-BR">
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js"></script>
<head>
<title>Sistema de Produtos</title>
</head>
<body>
<div class="container">
    <div class="topo">
        <div class="left">
            <input type="text" id="pesquisa" placeholder="Pesquisar por nome" onkeyup="filtrarProdutos()">
        </div>
        <div class="right">
            <button class="btn-add" onclick="abrirPopup('popupAdd')">
                +Adicionar
            </button>
            <button class="btn-delete" onclick="abrirPopup('popupDelete')">
                Excluir
            </button>
        </div>
    </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Tipo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="produtos"></tbody>
            </table>
        </div>
    </div>


<div class="overlay" id="popupAdd">
    
    <div class="popup">

        <h2>Adicionar Produto</h2>
        <input type="text" id="nomead" placeholder="Digite o nome do produto">
        <input type="text" id="precoad" placeholder="Preço">
        <input type="text" id="quantidadead" placeholder="Quantidade">
        <input type="text" id="tipoad" placeholder="Tipo">

        <div class="btn-container">
            <button class="btn-add" onclick="enviardados()">
                Adicionar Produto
            </button>
            <button class="btn-cancel" onclick="fecharPopup('popupAdd')">
                Cancelar
            </button>
        </div>
    </div>
</div>

<div class="overlay" id="popupEdit">

    <div class="popup">

        <h2>Editar Produto</h2>
        <input type="text" id="idedit" placeholder="ID" disabled>
        <input type="text" id="nomeedit" placeholder="Nome">
        <input type="text" id="precoedit" placeholder="Preço">
        <input type="text" id="quantidadeedit" placeholder="Quantidade">
        <input type="text" id="tipoedit" placeholder="Tipo">

        <div class="btn-container">
            <button class="btn-edit" onclick="enviardadosedit()">
                Editar Produto
            </button>
            <button class="btn-cancel" onclick="fecharPopup('popupEdit')">
                Cancelar
            </button>
        </div>
    </div>
</div>

<div class="overlay" id="popupDelete">

    <div class="popup">

        <h2>Excluir Produto</h2>
        <input type="text" id="iddelete" placeholder="Digite o ID do produto">
        <div class="btn-container">
            <button class="btn-delete" onclick="enviardadosdelete()">
                Excluir Produto
            </button>
            <button class="btn-cancel" onclick="fecharPopup('popupDelete')">
                Cancelar
            </button>
        </div>

    </div>

</div>
</body>
</html>
